---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
# ConfigMap: server.properties для Kafka (KRaft mode)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://kafka.kafka.svc.cluster.local:9092
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    log.dirs=/tmp/kafka-logs/data
    num.partitions=3
    default.replication.factor=1
    min.insync.replicas=1
---
# PersistentVolumeClaim для данных Kafka
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: kafka
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# Deployment Kafka (KRaft mode, без ZooKeeper)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        ports:
        - containerPort: 9092
          name: broker
        - containerPort: 9093
          name: controller
        env:
        - name: CLUSTER_ID
          value: "4L6g3pRtQfyI8MvFZqYd0A"
        command:
        - /bin/bash
        - -c
        - |
          LOG_DIR="/tmp/kafka-logs/data"
          mkdir -p "$LOG_DIR"
          echo "Starting Kafka in KRaft mode..."
          if [ ! -f "$LOG_DIR/meta.properties" ]; then
            echo "Formatting storage..."
            /opt/kafka/bin/kafka-storage.sh format -t $$CLUSTER_ID -c /opt/kafka/config/kraft/server.properties
          else
            echo "Storage already formatted, skipping format."
          fi
          echo "Starting Kafka server..."
          exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
        volumeMounts:
        - name: config
          mountPath: /opt/kafka/config/kraft/server.properties
          subPath: server.properties
        - name: data
          mountPath: /tmp/kafka-logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: kafka-config
      - name: data
        persistentVolumeClaim:
          claimName: kafka-data
---
# Service: внутренний доступ к Kafka
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    name: broker
---
# Deployment: Kafka UI (Provectus)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: "local"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: SERVER_SERVLET_CONTEXTPATH
          value: "/"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
# Service: для Kafka UI
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  selector:
    app: kafka-ui
  ports:
  - port: 80
    targetPort: 8080
---
# Ingress: доступ по http://kafka.mahmuzar
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  ingressClassName: nginx
  rules:
  - host: kafka.mahmuzar
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kafka-ui
            port:
              number: 80
