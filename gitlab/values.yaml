# values.yaml
global:
  hosts:
    domain: gitlab.mahmuzar
  storageClass: longhorn
  email:
    from: "gitlab@gitlab.mahmuzar"
    display_name: "GitLab"
  ingress:
    configureCertmanager: false
  minio:
    enabled: true

postgresql:
  install: true
redis:
  install: true

webservice:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

sidekiq:
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

registry:
  enabled: true

gitaly:
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    host: gitlab.mahmuzar
