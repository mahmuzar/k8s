# gitlab-simple.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:latest
        ports:
        - containerPort: 80
        - containerPort: 443
        - containerPort: 22
        env:
        - name: GITLAB_ROOT_PASSWORD
          value: "YourSecurePassword123!"
        - name: GITLAB_ROOT_EMAIL
          value: "admin@mahmuzar"
        - name: GITLAB_HOST
          value: "gitlab.mahmuzar"
        resources:
          requests:
            cpu: 2
            memory: 4Gi
          limits:
            cpu: 4
            memory: 8Gi
        volumeMounts:
        - name: gitlab-data
          mountPath: /var/opt/gitlab
        # ✅ Временно отключаем liveness probe
        # Liveness убивает под, если он долго запускается
        # livenessProbe:
        #   httpGet:
        #     path: /-/health
        #     port: 80
        #   initialDelaySeconds: 600
        #   periodSeconds: 30
        #   failureThreshold: 10
        # ✅ Readiness с большим delay и tcpSocket вместо http
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 300
          periodSeconds: 30
          failureThreshold: 20
      volumes:
      - name: gitlab-data
        persistentVolumeClaim:
          claimName: gitlab-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: gitlab
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
  - host: gitlab.mahmuzar
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitlab
            port:
              number: 80
